<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detour Check</title>
<link rel="stylesheet" href="main.css">
</head>
<body>
<div id="loading" class="loading" role="status">
  <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
</div>

<div id="desk" hidden>
  <header class="head">
    <div class="sub" id="sub">Bordeaux Métropole bus network</div>
    <div class="head-actions">
      <button class="btn" id="ask-week">Ask Rovo what needs attention</button>
      <span class="lozenge" id="live">Loading</span>
      <div class="menu">
        <button class="btn subtle" id="menu-btn" aria-expanded="false" aria-controls="menu-panel" title="Settings">•••</button>
        <div class="menu-panel" id="menu-panel" hidden>
          <div class="menu-label">Data</div>
          <div class="chips" id="mode-chips"></div>
          <p class="menu-note">The demo day is a frozen copy of Bordeaux's feeds, so the app matches the video. Live reads them now.</p>
          <div class="menu-label">Change requests go to</div>
          <div><span id="space-name"></span> <button class="link" id="change-space">Change</button></div>
          <div class="menu-label">Help</div>
          <button class="link" id="show-guide">Show the welcome tour</button>
        </div>
      </div>
    </div>
  </header>
  <div id="setup" hidden></div>
  <main id="app" hidden>
    <div class="desk">
      <section class="side" aria-label="Roadworks and detours">
        <label class="sr" for="search">Search</label>
        <input id="search" class="search" type="search" placeholder="Search a street or line">
        <div class="seg" id="seg" role="group" aria-label="Show"></div>
        <div class="list" id="list"></div>
      </section>
      <section class="stage">
        <div id="bigmap" class="bigmap"></div>
        <div class="map-legend" id="map-legend"></div>
        <aside class="card" id="detail" aria-live="polite" hidden></aside>
      </section>
    </div>
  </main>
</div>

<div id="panel" hidden></div>
<div id="tutorial" class="tutorial" hidden></div>

<script type="module" src="main.js"></script>
</body>
</html>
